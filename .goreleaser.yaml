version: 2

project_name: assh

# No `before.hooks` here on purpose. A `go mod tidy` hook can rewrite go.mod and
# go.sum mid-release, so the published binaries would no longer match the tagged
# commit. CI verifies the module files are already tidy instead.

builds:
  - id: assh
    main: ./cmd/assh
    binary: assh
    env:
      - CGO_ENABLED=0
    goos:
      - linux
      - darwin
      - windows
    goarch:
      - amd64
      - arm64
    ignore:
      - goos: windows
        goarch: arm64
    ldflags:
      - -s -w
      - -X github.com/izzzzzi/agent-assh/internal/cli.version={{.Version}}
      - -X github.com/izzzzzi/agent-assh/internal/cli.commit={{.Commit}}
      - -X github.com/izzzzzi/agent-assh/internal/cli.date={{.Date}}

archives:
  - id: default
    ids:
      - assh
    name_template: >-
      {{ .ProjectName }}_
      {{- .Version }}_
      {{- .Os }}_
      {{- .Arch }}
    format_overrides:
      - goos: windows
        formats: ["zip"]

checksum:
  name_template: checksums.txt

release:
  github:
    owner: izzzzzi
    name: agent-assh

snapshot:
  version_template: "{{ .Version }}"

changelog:
  sort: asc
  filters:
    exclude:
      - "^docs:"
      - "^test:"
