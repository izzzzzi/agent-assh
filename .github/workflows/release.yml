name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    name: Release
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0

      - name: Setup Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version: "1.22"

      - name: Setup Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: "22"
          registry-url: https://registry.npmjs.org

      - name: Verify npm version matches tag
        run: 'test "v$(node -p "require(''./package.json'').version")" = "$GITHUB_REF_NAME"'

      - name: Verify npm token is configured
        run: 'test -n "${NODE_AUTH_TOKEN:-}"'
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Verify npm version is unpublished
        run: |
          VERSION="$(node -p "require('./package.json').version")"
          if npm view "agent-assh@$VERSION" version >/dev/null 2>&1; then
            echo "agent-assh@$VERSION is already published" >&2
            exit 1
          fi

      - name: Install GoReleaser
        uses: goreleaser/goreleaser-action@a4f02ab5355a589de60d917a659ce617ed19b3de # v7
        with:
          install-only: true
          version: v2.12.7

      - name: Run release preflight checks
        run: |
          npm run smoke
          npm pack --dry-run
          npm run release:contract

      - name: Release binaries
        uses: goreleaser/goreleaser-action@a4f02ab5355a589de60d917a659ce617ed19b3de # v7
        with:
          version: v2.12.7
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish npm package
        run: npm publish --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
